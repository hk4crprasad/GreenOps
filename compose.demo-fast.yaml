# Use after compose.yaml. The database URLs and storage provider come from .env.
# Add compose.azure.yaml when OBJECT_STORAGE_PROVIDER=azure to skip MinIO.
x-fast-environment: &fast-environment
  APP_MODE: demo
  DATABASE_URL: ${LOCAL_DATABASE_URL:?Set LOCAL_DATABASE_URL in .env for FastDemo}
  REDIS_URL: redis://redis:6379/0
  COOKIE_SECURE: 'false'
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD in .env}
    volumes: !override
      - demo-fast-postgres:/var/lib/postgresql
      - ./infra/bootstrap.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro,z
  minio:
    volumes: !override [demo-fast-minio:/data]
  migrate:
    environment:
      APP_MODE: demo
      DATABASE_URL: ${LOCAL_DATABASE_URL:?Set LOCAL_DATABASE_URL in .env for FastDemo}
      MIGRATION_DATABASE_URL: ${LOCAL_MIGRATION_DATABASE_URL:?Set LOCAL_MIGRATION_DATABASE_URL in .env for FastDemo}
    command: [sh, -c, 'alembic upgrade head && python -m app.bootstrap && python -m app.cli seed-demo && python -m app.cli generate-world --config /app/data/public/extended-demo.yaml']
    volumes: !override [demo-fast-shared:/app/shared]
  api:
    environment: *fast-environment
    volumes: !override [demo-fast-shared:/app/shared]
  worker:
    environment: *fast-environment
    volumes: !override [demo-fast-shared:/app/shared]
  scheduler:
    environment: *fast-environment
    volumes: !override [demo-fast-shared:/app/shared]
  web:
    volumes: !override [demo-fast-shared:/app/shared:ro]
volumes:
  demo-fast-postgres:
  demo-fast-minio:
  demo-fast-shared:
